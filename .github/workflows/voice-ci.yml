name: Voice feature CI

on:
  pull_request:
    branches:
      - main
      - feat/multilingual-voice-widget
  push:
    branches:
      - feat/multilingual-voice-widget
      - perf/voice-latency-diagnostics

permissions:
  contents: read

concurrency:
  group: voice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and generate TanStack routes
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
