name: Voice feature CI

on:
  pull_request:
    branches:
      - main
      - feat/multilingual-voice-widget
  push:
    branches:
      - feat/multilingual-voice-widget
      - perf/voice-latency-diagnostics

permissions:
  contents: read

concurrency:
  group: voice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and generate TanStack routes
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test
